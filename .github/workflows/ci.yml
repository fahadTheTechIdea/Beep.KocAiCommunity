name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Beep.KocAiCommunity.slnx

      - name: Format check
        run: dotnet format Beep.KocAiCommunity.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build Beep.KocAiCommunity.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test Beep.KocAiCommunity.slnx --no-build --verbosity normal
