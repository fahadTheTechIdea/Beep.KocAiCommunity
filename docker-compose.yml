# Local production-shape stack: SQL Server + API + Web + Worker.
#
#   docker compose up --build
#   open http://localhost:5150
#
# This compose runs a SEEDED DEMO (dev auth + starter data on SQL Server). For real production,
# see docs/DEPLOYMENT.md: set ASPNETCORE_ENVIRONMENT=Production, configure AzureAd (Entra), and
# set Seed__Enabled=false and DevAuth__Enabled=false.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Koc_Str0ng_Pass!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__kocdb: "Server=sql;Database=koc;User Id=sa;Password=Koc_Str0ng_Pass!;TrustServerCertificate=True"
      Seed__Enabled: "true"          # migrate (SQL Server) + seed starter tracks and dev org
      DevAuth__Enabled: "true"       # demo only — replace with AzureAd in production
      DevAuth__Roles: "Employee,Manager,CompetitionAdmin"
      Outbox__DispatcherEnabled: "true"
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "5250:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      KocApi__BaseUrl: "http://api:8080"
    depends_on:
      - api
    ports:
      - "5150:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__kocdb: "Server=sql;Database=koc;User Id=sa;Password=Koc_Str0ng_Pass!;TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
