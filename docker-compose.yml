# Local production-shape stack: SQL Server + Web + Worker.
#
#   docker compose up --build
#   open http://localhost:5150
#
# Two services, not three. The platform surface — /api/v1, the leaderboard hub, the outbox dispatcher —
# is a library the website hosts in its own process (since 2026-08-02), so there is no API container and
# nothing for the web to call across the network. The website owns the database directly, which is why
# the connection string and the seed switch live on it here rather than on a separate API service.
#
# This compose runs a SEEDED DEMO (dev auth + starter data on SQL Server). For real production,
# see docs/DEPLOYMENT.md: set ASPNETCORE_ENVIRONMENT=Production, configure AzureAd (Entra), and
# set Seed__Enabled=false and DevAuth__Enabled=false.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Koc_Str0ng_Pass!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__kocdb: "Server=sql;Database=koc;User Id=sa;Password=Koc_Str0ng_Pass!;TrustServerCertificate=True"
      Seed__Enabled: "true"          # migrate (SQL Server) + seed the demo data on top of the catalogue
      DevAuth__Enabled: "true"       # demo only — replace with AzureAd in production
      DevAuth__Roles: "Employee,Manager,CompetitionAdmin"
      Outbox__DispatcherEnabled: "true"
      # KocApi__BaseUrl is deliberately unset: the surface is in this process, so the client defaults to
      # the host's own loopback listener. Set it only for an install that genuinely keeps it elsewhere.
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "5150:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__kocdb: "Server=sql;Database=koc;User Id=sa;Password=Koc_Str0ng_Pass!;TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
